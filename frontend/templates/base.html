<!--

  - Remplacer les balises de commentaires par les vraies balises Django
  - Remplacer les chemins statiques relatifs par {% static '...' %}

<html lang="fr" data-theme="">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="<!-- {% block meta_description %} -->CS² Health — Application de gestion de centre de santé<!-- {% endblock %} -->">

  <!-- Django: <title><!-- {% block title %}CS² Health{% endblock %} --></title> -->
  <title><!-- block title -->CS² Health<!-- endblock title --></title>

  <!-- Tailwind CSS via CDN with CS² Theme Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            cs2: {
              brand: {
                50: '#f0fdfa',
                100: '#ccfbf1',
                500: '#0d9488',
                600: '#0f766e',
                700: '#115e59',
                950: '#042f2e',
              },
              neutral: {
                50: '#f8fafc',
                100: '#f1f5f9',
                200: '#e2e8f0',
                300: '#cbd5e1',
                600: '#475569',
                800: '#1e293b',
                950: '#020617',
              },
              status: {
                emergency: '#dc2626',
                warning: '#d97706',
                success: '#059669',
                info: '#2563eb',
              }
            }
          },
          fontFamily: {
            title: ['Plus Jakarta Sans', 'sans-serif'],
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <!-- Favicon -->
  <!-- Django: <link rel="icon" href="{% static 'img/favicon.ico' %}" type="image/x-icon"> -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏥</text></svg>" type="image/svg+xml">

  <!--
    ════════════════════════════════════════════
    CORE CSS — Chargé dans l'ordre exact requis
    ════════════════════════════════════════════
  -->
  <!-- 1. Tokens design system -->
  <!-- Django: <link rel="stylesheet" href="{% static 'css/variables.css' %}"> -->

  <!-- 2. Reset et base typographique -->

  <link rel="stylesheet" href="../static/css/base.css">

  <!-- 3. Système de layout -->
  <!-- Django: <link rel="stylesheet" href="{% static 'css/layout.css' %}"> -->
  <link rel="stylesheet" href="../static/css/layout.css">

  <!-- 4. Composants UI -->
  <!-- Django: <link rel="stylesheet" href="{% static 'css/components.css' %}"> -->
  <link rel="stylesheet" href="../static/css/components.css">

  <!-- 5. Formulaires -->
  <!-- Django: <link rel="stylesheet" href="{% static 'css/forms.css' %}"> -->
  <link rel="stylesheet" href="../static/css/forms.css">

  <!-- 6. Tableaux -->
  <!-- Django: <link rel="stylesheet" href="{% static 'css/tables.css' %}"> -->
  <link rel="stylesheet" href="../static/css/tables.css">

  <!-- 7. Utilitaires -->
  <!-- Django: <link rel="stylesheet" href="{% static 'css/utilities.css' %}"> -->
  <link rel="stylesheet" href="../static/css/utilities.css">

  <!-- 8. Responsive -->
  <!-- Django: <link rel="stylesheet" href="{% static 'css/responsive.css' %}"> -->
  <link rel="stylesheet" href="../static/css/responsive.css">

  <!-- CSS page spécifique -->
  <!-- Django: <!-- {% block extra_css %} -->{% endblock %} -->

  <!--
    Appliquer le thème immédiatement pour éviter le flash
    (doit rester ici, avant le rendu du body)
  -->
  <script>
    (function() {
      var stored = localStorage.getItem('cs2-theme');
      var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      var theme = stored || (prefersDark ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
</head>
<body>

  <!--
    SVG Sprite — chargé une seule fois dans le body
    Django: {% include 'partials/icons.html' %}
  -->
  <!-- SVG sprite injection point -->

  <!-- Django: <!-- {% block layout %} -->{% endblock %} -->

  <script src="../static/js/core/theme.js"></script>

  <!-- Composants UI -->
  <script src="../static/js/components/dropdown.js"></script>
  <script src="../static/js/components/navigation.js"></script>
  <script src="../static/js/core/app.js"></script>

  <!-- JS page spécifique -->

</body>
