<!-- {% load static %} -->
<!DOCTYPE html>
<html lang="fr" class="h-full bg-cs2-neutral-50 antialiased text-cs2-neutral-900 scroll-smooth" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title><!-- {% block title %}CS² Health — Module Réception{% endblock %} --></title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="icon" href="../../../static/images/logo.svg" type="image/svg+xml">



  <!-- Chart.js for Interactive Dashboard Charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- Compiled Tailwind CSS & Design System -->
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <!-- Fallback local stylesheets for static file preview -->
  <link rel="stylesheet" href="../../../static/css/styles.css">
  <!-- {% block extra_head %} --><!-- {% endblock %} -->
</head>
<body class="h-full bg-cs2-neutral-50 text-cs2-neutral-900 font-sans flex flex-col antialiased selection:bg-cs2-brand-600 selection:text-white">

  <!-- Accessibilité : Skip Link pour la navigation au clavier -->
  <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2.5 focus:bg-cs2-brand-600 focus:text-white focus:rounded-xl focus:shadow-lg focus:font-extrabold focus:outline-none">
    Aller au contenu principal
  </a>

  <!-- Layout Container avec Sidebar et zone principale -->
  <div class="flex h-screen overflow-hidden bg-cs2-neutral-50">

    <!-- Sidebar Unique Source de Vérité -->
    {% include "components/sidebar.html" %}

    <!-- Zone de droite : Topbar Header + Contenu -->
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">

      <!-- Topbar Header Component -->
      {% include "components/header.html" %}

      <!-- Zone de contenu défilable principale -->
      <main id="main-content" tabindex="-1" class="flex-1 overflow-y-auto p-4 md:p-8 max-w-7xl w-full mx-auto space-y-6 focus:outline-none">

        <!-- Fil d'ariane / Breadcrumb Block -->
        <nav aria-label="Fil d'Ariane" class="flex items-center gap-2 text-xs font-medium text-cs2-neutral-600">
          <!-- {% block breadcrumb %} --><!-- {% endblock %} -->
        </nav>

        <!-- Bloc principal de la page -->
        <!-- {% block content %} --><!-- {% endblock %} -->

      </main>

    </div>

  </div>

  <script src="{% static 'js/components/cs2-logo.js' %}"></script>
  <script src="{% static 'js/core/theme.js' %}"></script>
  <script src="{% static 'js/components/navigation.js' %}"></script>
  <script src="{% static 'js/components/modal.js' %}"></script>
  <script src="{% static 'js/components/dropdown.js' %}"></script>
  <script src="{% static 'js/core/app.js' %}"></script>
  
  <!-- Fallbacks JS pour prévisualisation directe sans serveur Django -->
  <script src="../../../static/js/core/cs2-paths.js"></script>
  <script src="../../../static/js/components/cs2-logo.js"></script>
  <script src="../../../static/js/core/theme.js"></script>
  <script src="../../../static/js/components/navigation.js"></script>
  <script src="../../../static/js/components/modal.js"></script>
  <script src="../../../static/js/components/dropdown.js"></script>
  <script src="../../../static/js/core/app.js"></script>

  <!-- {% block extra_js %} --><!-- {% endblock %} -->

</body>
</html>
