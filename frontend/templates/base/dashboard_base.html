    <!-- A small script to load components for static HTML viewing purposes only (won't be used in Django) -->

        // Only for static preview. In Django, {% include %} will handle this.
        fetch('../../templates/components/sidebar.html')
            .then(r => r.text())
            .then(html => document.getElementById('sidebar-container').outerHTML = html);
