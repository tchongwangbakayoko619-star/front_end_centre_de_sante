<!DOCTYPE html>
<html lang="fr" class="h-full bg-cs2-neutral-50 antialiased text-cs2-neutral-900 scroll-smooth" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CS² Health — Dashboard Agent d'accueil</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <link rel="stylesheet" href="../../../../static/css/styles.css">
</head>
<body class="h-full bg-cs2-neutral-50 text-cs2-neutral-900 font-sans flex flex-col antialiased selection:bg-cs2-brand-600 selection:text-white">
  <a href="#main-content" class="sr-only focus:not-sr-only focus:fixed focus:top-4 focus:left-4 focus:z-50 focus:px-4 focus:py-2.5 focus:bg-cs2-brand-600 focus:text-white focus:rounded-xl focus:shadow-lg focus:font-extrabold focus:outline-none">
    Aller au contenu principal
  </a>
  <div class="flex h-screen overflow-hidden bg-cs2-neutral-50">
    <div id="sidebar-mount"></div>
    <div class="flex-1 flex flex-col min-w-0 overflow-hidden">
      <div id="header-mount"></div>
      <main id="main-content" tabindex="-1" class="flex-1 overflow-y-auto p-4 md:p-8 max-w-7xl w-full mx-auto space-y-6 focus:outline-none">
        <!-- {% block content %} -->
<nav aria-label="Fil d'Ariane" class="flex items-center gap-2 text-xs font-semibold text-cs2-neutral-600 mb-3"><a href="../dashboard.html" class="flex items-center gap-1.5 text-cs2-neutral-500 hover:text-cs2-brand-600 transition font-medium"><svg class="w-3.5 h-3.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg><span>Accueil</span></a><svg class="w-3 h-3 text-cs2-neutral-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg><a href="list.html" class="text-cs2-neutral-500 hover:text-cs2-brand-600 transition font-medium">Registre des Patients</a><svg class="w-3 h-3 text-cs2-neutral-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 5l7 7-7 7"/></svg><span class="text-cs2-brand-600 font-extrabold">Enregistrer un Patient</span></nav>
<div class="pb-3 border-b border-cs2-neutral-200">
        <h1 class="text-2xl font-extrabold text-cs2-neutral-950 font-title tracking-tight">Enregistrer un nouveau patient</h1>
        <p class="text-xs text-cs2-neutral-600 mt-1">Création du dossier administratif d'admission du patient (Identité, contact, assurance).</p>
      </div>

      <div class="bg-white p-5 sm:p-6 rounded-2xl border border-cs2-neutral-200 shadow-sm">
        <form action="detail.html" method="GET" class="space-y-6">
          
          <div class="space-y-4">
            <h3 class="text-xs font-extrabold uppercase tracking-wider text-cs2-brand-700 bg-cs2-brand-50 px-3 py-1.5 rounded-lg inline-block">
              1. Identité Civile
            </h3>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div class="space-y-1">
                <label for="id_nom" class="block text-xs font-bold text-cs2-neutral-800">Nom de famille <span class="text-red-500">*</span></label>
                <input type="text" id="id_nom" name="nom" required placeholder="Ex: DUPONT" class="w-full appearance-none bg-cs2-neutral-50 border border-cs2-neutral-200/90 rounded-xl py-2.5 pl-3.5 pr-9 text-xs font-medium text-cs2-neutral-950 focus:bg-white focus:border-cs2-brand-600 focus:ring-2 focus:ring-cs2-brand-100 focus:outline-none transition shadow-2xs cursor-pointer uppercase">
              </div>
              <div class="space-y-1">
                <label for="id_prenom" class="block text-xs font-bold text-cs2-neutral-800">Prénoms <span class="text-red-500">*</span></label>
                <input type="text" id="id_prenom" name="prenom" required placeholder="Ex: Jeanne Marie" class="w-full appearance-none bg-cs2-neutral-50 border border-cs2-neutral-200/90 rounded-xl py-2.5 pl-3.5 pr-9 text-xs font-medium text-cs2-neutral-950 focus:bg-white focus:border-cs2-brand-600 focus:ring-2 focus:ring-cs2-brand-100 focus:outline-none transition shadow-2xs cursor-pointer">
              </div>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
              <div class="space-y-1">
                <label for="id_genre" class="block text-xs font-bold text-cs2-neutral-800">Genre <span class="text-red-500">*</span></label>
                <div class="relative">
                  <select id="id_genre" name="genre" required style="color: #0f172a !important; background-color: #ffffff !important; font-weight: 500 !important;" class="w-full appearance-none bg-white border border-cs2-neutral-300 hover:border-cs2-brand-600 rounded-xl py-2.5 pl-3.5 pr-9 text-xs font-medium text-cs2-neutral-900 focus:bg-white focus:border-cs2-brand-600 focus:ring-2 focus:ring-cs2-brand-100 focus:outline-none transition cursor-pointer">
                    <option value="" disabled selected style="color: #64748b !important; background-color: #ffffff !important;" class="bg-white text-cs2-neutral-500 font-medium">Sélectionner le genre...</option>
                    <option value="Féminin" style="color: #0f172a !important; background-color: #ffffff !important;" class="bg-white text-cs2-neutral-900 font-medium py-1.5 px-3">Féminin</option>
                    <option value="Masculin" style="color: #0f172a !important; background-color: #ffffff !important;" class="bg-white text-cs2-neutral-900 font-medium py-1.5 px-3">Masculin</option>
                  </select>
                  <div class="absolute inset-y-0 right-0 pr-3 flex items-center pointer-events-none text-cs2-brand-600">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
                  </div>
                </div>
              </div>

              <div class="space-y-1">
                <label for="id_dob" class="block text-xs font-bold text-cs2-neutral-800">Date de naissance <span class="text-red-500">*</span></label>
                <input type="date" id="id_dob" name="dob" required class="w-full appearance-none bg-cs2-neutral-50 border border-cs2-neutral-200/90 rounded-xl py-2.5 pl-3.5 pr-9 text-xs font-medium text-cs2-neutral-950 focus:bg-white focus:border-cs2-brand-600 focus:ring-2 focus:ring-cs2-brand-100 focus:outline-none transition shadow-2xs cursor-pointer">
              </div>

              <div class="space-y-1">
                <label for="id_nup" class="block text-xs font-bold text-cs2-neutral-800">NUP (Numéro Unique Patient)</label>
                <input type="text" id="id_nup" name="nup" placeholder="Généré automatiquement si vide" class="w-full bg-cs2-neutral-100 border border-cs2-neutral-200 rounded-xl py-2.5 px-3.5 text-xs font-mono text-cs2-neutral-700">
              </div>
            </div>
          </div>

          <div class="space-y-4 pt-4 border-t border-cs2-neutral-200">
            <h3 class="text-xs font-extrabold uppercase tracking-wider text-cs2-brand-700 bg-cs2-brand-50 px-3 py-1.5 rounded-lg inline-block">
              2. Coordonnées de Contact
            </h3>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
              <div class="space-y-1">
                <label for="id_telephone" class="block text-xs font-bold text-cs2-neutral-800">Numéro de téléphone <span class="text-red-500">*</span></label>
                <input type="tel" id="id_telephone" name="telephone" required placeholder="+225 07 08 45 12 90" class="w-full appearance-none bg-cs2-neutral-50 border border-cs2-neutral-200/90 rounded-xl py-2.5 pl-3.5 pr-9 text-xs font-medium text-cs2-neutral-950 focus:bg-white focus:border-cs2-brand-600 focus:ring-2 focus:ring-cs2-brand-100 focus:outline-none transition shadow-2xs cursor-pointer">
              </div>

              <div class="space-y-1">
                <label for="id_email" class="block text-xs font-bold text-cs2-neutral-800">Adresse email</label>
                <input type="email" id="id_email" name="email" placeholder="patient@exemple.org" class="w-full appearance-none bg-cs2-neutral-50 border border-cs2-neutral-200/90 rounded-xl py-2.5 pl-3.5 pr-9 text-xs font-medium text-cs2-neutral-950 focus:bg-white focus:border-cs2-brand-600 focus:ring-2 focus:ring-cs2-brand-100 focus:outline-none transition shadow-2xs cursor-pointer">
              </div>
            </div>
          </div>

          <div class="flex items-center justify-end gap-3 pt-6 border-t border-cs2-neutral-200">
            <a href="list.html" class="px-5 py-2.5 rounded-xl border border-cs2-neutral-200 text-xs font-bold text-cs2-neutral-700 hover:bg-cs2-neutral-100 transition">
              Annuler
            </a>
            <button type="submit" class="px-5 py-2.5 rounded-xl bg-cs2-brand-600 hover:bg-cs2-brand-700 text-white text-xs font-bold transition shadow-md">
              Enregistrer le patient
            </button>
          </div>

        </form>
      </div>
        <!-- {% endblock %} -->
      </main>
    </div>
  </div>
  <script src="../../../../static/js/core/cs2-paths.js"></script>
  <script src="../../../../static/js/components/cs2-logo.js"></script>
  <script src="../../../../static/js/loaders/sidebar-loader.js"></script>
  <script src="../../../../static/js/loaders/header-loader.js"></script>
  <script src="../../../../static/js/core/theme.js"></script>
  <script src="../../../../static/js/components/navigation.js"></script>
  <script src="../../../../static/js/components/modal.js"></script>
  <script src="../../../../static/js/components/dropdown.js"></script>
  <script src="../../../../static/js/core/app.js"></script>
  <!-- {% block extra_js %} -->

  <!-- {% endblock %} -->
</body>
</html>
