<!-- templates/components/auth/password-input.html -->
<!-- 
Expected Context:
- id: HTML id
- name: input name
- label: Input label
- placeholder: Input placeholder
- required: boolean
- error: String error message 
- show_strength: boolean
-->
<div class="form-group">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: var(--space-2);">
        <label for="<!-- Django: {{ id }} -->" class="form-label" style="margin-bottom: 0;">
            <!-- Django: {{ label|default:'Mot de passe' }} -->
            <!-- Django: {% if required %}<span style="color: var(--color-error-500)">*</span>{% endif %} -->
        </label>
        
        <!-- Django: {% if show_forgot_link %} -->
        <a href="forgot-password.html" class="text-sm">Mot de passe oublié ?</a>
        <!-- Django: {% endif %} -->
    </div>
    
    <div class="password-input-wrapper">
        <input 
            type="password" 
            id="<!-- Django: {{ id }} -->" 
            name="<!-- Django: {{ name }} -->" 
            class="form-control <!-- Django: {% if error %}is-invalid{% endif %} -->" 
            placeholder="<!-- Django: {{ placeholder|default:'••••••••' }} -->"
            <!-- Django: {% if required %}required{% endif %} -->
        >
        
        <button type="button" class="password-toggle-btn" aria-label="Afficher le mot de passe" style="color:#94a3b8;transition:none;background:transparent;border:none;outline:none;" onmouseover="this.style.color='#94a3b8'" onmouseout="this.style.color='#94a3b8'">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-eye"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-eye-off" style="display: none;"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/></svg>
        </button>
    </div>
    
    <div class="invalid-feedback">
        <!-- Django: {{ error }} -->
        Veuillez entrer un mot de passe valide.
    </div>

    <!-- Django: {% if show_strength %} -->
    <div class="password-strength-container" style="display: none;">
        <div class="password-strength-bar">
            <div class="password-strength-fill" id="strength-fill-<!-- Django: {{ id }} -->"></div>
        </div>
        <div class="password-strength-text" id="strength-text-<!-- Django: {{ id }} -->">Force du mot de passe</div>
    </div>
    <!-- Django: {% endif %} -->
</div>
