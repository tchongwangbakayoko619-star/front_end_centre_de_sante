<!-- Static HTML Preview -->
<div class="pagination">
    <div class="pagination-info">
        Affichage de 1 à 10 sur 45 résultats
    </div>
    <div class="pagination-controls">
        <button class="pagination-btn" disabled>&laquo;</button>
        <button class="pagination-btn active">1</button>
        <a href="#" class="pagination-btn">2</a>
        <a href="#" class="pagination-btn">3</a>
        <span class="pagination-btn" style="border:none;background:transparent;cursor:default;">...</span>
        <a href="#" class="pagination-btn">5</a>
        <a href="#" class="pagination-btn">&raquo;</a>
    </div>
</div>
