<!-- templates/components/ui/confirmation_modal.html -->
<div id="confirmation-modal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-cs2-neutral-950/50 backdrop-blur-sm hidden">
  <div class="bg-white rounded-2xl border border-cs2-neutral-200 shadow-2xl max-w-md w-full p-6 space-y-5 transform transition-all">
    <div class="flex items-center gap-4">
      <div class="w-12 h-12 rounded-2xl bg-red-50 text-red-600 flex items-center justify-center flex-shrink-0 border border-red-100">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
      </div>
      <div>
        <h3 class="text-base font-extrabold text-cs2-neutral-950 font-title">Confirmer l'action</h3>
        <p class="text-xs text-cs2-neutral-600 mt-1">Êtes-vous sûr de vouloir effectuer cette opération ? Cette action peut être irréversible.</p>
      </div>
    </div>

    <!-- Modal Form Content Slot -->
    <div class="space-y-4 text-xs">
      <!-- Django: <!-- {% block confirmation_content %} -->{% endblock %} -->
    </div>

    <!-- Action Buttons -->
    <div class="flex items-center justify-end gap-3 pt-4 border-t border-cs2-neutral-200">
      <button type="button" onclick="closeConfirmationModal()" class="px-4 py-2.5 rounded-xl border border-cs2-neutral-200 text-xs font-bold text-cs2-neutral-700 hover:bg-cs2-neutral-100 transition">
        Annuler
      </button>
      <button type="button" class="px-4 py-2.5 rounded-xl bg-red-600 hover:bg-red-700 text-xs font-bold text-white transition shadow-sm">
        Confirmer l'annulation
      </button>
    </div>
  </div>
</div>

<script>
  function openConfirmationModal() {
    document.getElementById('confirmation-modal')?.classList.remove('hidden');
  }
  function closeConfirmationModal() {
    document.getElementById('confirmation-modal')?.classList.add('hidden');
  }
</script>
