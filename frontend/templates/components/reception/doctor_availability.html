<!-- templates/components/reception/doctor_availability.html -->
<div class="space-y-3">
  <div class="flex items-center justify-between">
    <span class="text-xs font-bold text-cs2-neutral-800 uppercase tracking-wider">Créneaux horaires disponibles (Dr. Valois)</span>
    <span class="text-[11px] font-semibold text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded-md border border-emerald-200">8 créneaux libres</span>
  </div>
  <div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 gap-2">
    <!-- Créneaux libres (Sélectionnables) -->
    <button type="button" class="py-2 px-3 rounded-xl border border-cs2-neutral-200 bg-white text-xs font-bold text-cs2-neutral-800 hover:border-cs2-brand-600 hover:bg-cs2-brand-50 hover:text-cs2-brand-700 transition text-center">
      08:30
    </button>
    <button type="button" class="py-2 px-3 rounded-xl border border-cs2-brand-600 bg-cs2-brand-600 text-xs font-bold text-white shadow-sm text-center">
      09:00
    </button>
    <button type="button" class="py-2 px-3 rounded-xl border border-cs2-neutral-200 bg-white text-xs font-bold text-cs2-neutral-800 hover:border-cs2-brand-600 hover:bg-cs2-brand-50 hover:text-cs2-brand-700 transition text-center">
      09:30
    </button>

    <!-- Créneaux occupés (Désactivés & Grisés) -->
    <button type="button" disabled class="py-2 px-3 rounded-xl border border-cs2-neutral-200 bg-cs2-neutral-100 text-xs font-semibold text-cs2-neutral-400 cursor-not-allowed text-center opacity-60">
      10:00 (Occupé)
    </button>
    <button type="button" disabled class="py-2 px-3 rounded-xl border border-cs2-neutral-200 bg-cs2-neutral-100 text-xs font-semibold text-cs2-neutral-400 cursor-not-allowed text-center opacity-60">
      10:30 (Occupé)
    </button>
    <button type="button" class="py-2 px-3 rounded-xl border border-cs2-neutral-200 bg-white text-xs font-bold text-cs2-neutral-800 hover:border-cs2-brand-600 hover:bg-cs2-brand-50 hover:text-cs2-brand-700 transition text-center">
      11:00
    </button>
  </div>
</div>
