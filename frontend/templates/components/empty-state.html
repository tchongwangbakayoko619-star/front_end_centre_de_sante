<!-- CS² Health Design System — Empty State Component -->
<!-- Usage Django: {% include "components/empty-state.html" with message="Aucun patient trouvé." action_text="Nouveau Patient" action_url="patients:create" %} -->
<div class="p-12 text-center flex flex-col items-center justify-center space-y-4 bg-white rounded-2xl border border-cs2-neutral-200 shadow-2xs">
    <div class="w-14 h-14 rounded-2xl bg-cs2-neutral-100 text-cs2-neutral-600 flex items-center justify-center border border-cs2-neutral-200">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"/>
        </svg>
    </div>
    <h4 class="text-sm font-extrabold text-cs2-neutral-950 font-title">
        {{ title|default:"Aucune donnée" }}
    </h4>
    <p class="text-xs text-cs2-neutral-600 max-w-sm">
        {{ message|default:"Aucun enregistrement n'a été trouvé pour le moment." }}
    </p>
    {% if action_url %}
        <a href="{% url action_url %}" class="btn-primary">{{ action_text|default:"Créer un enregistrement" }}</a>
    {% else %}
        <a href="#" class="btn-primary">{{ action_text|default:"Créer un enregistrement" }}</a>
    {% endif %}
</div>
