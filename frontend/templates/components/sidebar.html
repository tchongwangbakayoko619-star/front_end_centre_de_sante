<script>
  (function() {
    const STORAGE_KEY = 'cs2_open_submenus';
    function getOpenSubmenus() {
      try {
        const stored = localStorage.getItem(STORAGE_KEY) || sessionStorage.getItem(STORAGE_KEY);
        return stored ? JSON.parse(stored) : [];
      } catch (e) { return []; }
    }
    function saveOpenSubmenus(list) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
        sessionStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      } catch (e) {}
    }
    if (typeof window.toggleSidebarSubmenu !== 'function') {
      window.toggleSidebarSubmenu = function(id) {
        const sub = document.getElementById(id);
        const chevron = document.getElementById(id + '-chevron');
        if (!sub) return;
        const isHidden = sub.classList.contains('hidden');
        let openList = getOpenSubmenus();
        if (isHidden) {
          sub.classList.remove('hidden');
          if (chevron) chevron.classList.add('rotate-180');
          if (!openList.includes(id)) openList.push(id);
        } else {
          sub.classList.add('hidden');
          if (chevron) chevron.classList.remove('rotate-180');
          openList = openList.filter(item => item !== id);
        }
        saveOpenSubmenus(openList);
      };
    }
    setTimeout(function() {
      let openList = getOpenSubmenus();
      const active = window.SIDEBAR_ACTIVE || '';
      if (active) {
        const link = document.querySelector('[data-nav-link="' + active + '"]');
        if (link) {
          const parentSub = link.closest('[id$="-sub"]');
          if (parentSub && !openList.includes(parentSub.id)) openList.push(parentSub.id);
        }
      }
      saveOpenSubmenus(openList);
      openList.forEach(function(id) {
        const sub = document.getElementById(id);
        const chevron = document.getElementById(id + '-chevron');
        if (sub) sub.classList.remove('hidden');
        if (chevron) chevron.classList.add('rotate-180');
      });
    }, 50);
  })();

  if (typeof window.openMobileSidebar !== 'function') {
    window.openMobileSidebar = function() {
      const sidebar = document.getElementById('app-sidebar') || document.getElementById('sidebar');
      const overlay = document.getElementById('mobile-sidebar-overlay') || document.getElementById('sidebar-overlay');
      if (sidebar) {
        sidebar.classList.remove('-translate-x-full');
        sidebar.classList.add('translate-x-0', 'is-open');
      }
      if (overlay) {
        overlay.classList.remove('opacity-0', 'pointer-events-none');
        overlay.classList.add('opacity-100', 'pointer-events-auto', 'is-visible');
      }
      document.body.style.overflow = 'hidden';
    };
    window.closeMobileSidebar = function() {
      const sidebar = document.getElementById('app-sidebar') || document.getElementById('sidebar');
      const overlay = document.getElementById('mobile-sidebar-overlay') || document.getElementById('sidebar-overlay');
      if (sidebar) {
        sidebar.classList.add('-translate-x-full');
        sidebar.classList.remove('translate-x-0', 'is-open');
      }
      if (overlay) {
        overlay.classList.add('opacity-0', 'pointer-events-none');
        overlay.classList.remove('opacity-100', 'pointer-events-auto', 'is-visible');
      }
      document.body.style.overflow = '';
    };
    window.toggleMobileSidebar = function() {
      const sidebar = document.getElementById('app-sidebar') || document.getElementById('sidebar');
      if (sidebar && (sidebar.classList.contains('translate-x-0') || sidebar.classList.contains('is-open'))) {
        window.closeMobileSidebar();
      } else {
        window.openMobileSidebar();
      }
    };
  }
</script>
