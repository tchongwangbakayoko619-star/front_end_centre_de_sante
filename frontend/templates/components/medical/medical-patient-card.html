<!-- templates/components/medical/medical-patient-card.html — COMPOSANT CARTE PATIENT MÉDICAL CS² HEALTH -->
<!-- 
Expected Context:
- name: Patient Name
- initials: Initials (e.g. 'AK')
- nss: Social Security Number
- age: Age
- gender: Gender ('Femme' / 'Homme')
- motif: Consultation motif
- status: Status badge text ('Dossier actif', 'En attente')
- allergy: Allergy text or null
- detail_url: Link to detail page
-->
<div class="medical-patient-card p-4 rounded-2xl border border-cs2-neutral-200 bg-white hover:border-cs2-brand-500 transition shadow-2xs space-y-3">
  <div class="flex items-start justify-between gap-3">
    <div class="flex items-center gap-3">
      <div class="w-11 h-11 rounded-xl bg-cs2-brand-50 text-cs2-brand-700 font-extrabold text-sm flex items-center justify-center border border-cs2-brand-200 shadow-2xs font-title">
        <!-- Django: {{ initials|default:'AK' }} -->AK
      </div>
      <div>
        <h3 class="text-xs font-extrabold text-cs2-neutral-950 font-title"><!-- Django: {{ name }} -->Alice KONÉ</h3>
        <p class="text-[10px] text-cs2-neutral-500 font-mono"><!-- Django: {{ gender }} -->Femme • <!-- Django: {{ age }} -->32 ans • NSS: <!-- Django: {{ nss }} -->284-901-342</p>
      </div>
    </div>
    <span class="px-2.5 py-0.5 rounded-full text-[10px] font-extrabold bg-white text-emerald-700 border border-emerald-200 shadow-2xs">
      <!-- Django: {{ status|default:'Dossier actif' }} -->Dossier actif
    </span>
  </div>

  <!-- Django: {% if allergy %} -->
  <div class="p-2.5 rounded-xl border border-rose-200 bg-rose-50/60 text-[11px] font-bold text-rose-900 flex items-center gap-1.5">
    <svg class="w-3.5 h-3.5 text-rose-600 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/></svg>
    <span>Allergie : <strong>Pénicilline</strong></span>
  </div>
  <!-- Django: {% endif %} -->

  <div class="flex items-center justify-between pt-2 border-t border-cs2-neutral-100 text-xs">
    <span class="text-[11px] text-cs2-neutral-600 font-medium">Motif : Douleurs Thoraciques</span>
    <a href="<!-- Django: {{ detail_url }} -->patients/detail.html" class="px-3 py-1 rounded-lg bg-cs2-brand-600 hover:bg-cs2-brand-700 text-white font-extrabold text-[11px] transition shadow-2xs">
      Accéder à la fiche →
    </a>
  </div>
</div>
